<style>
:root{--em:#0b3d36;--em2:#0f5c4f;--gold:#f5c451;--gold2:#ffe08a;--neon:#3dffc4;--txt:#f4fff9;--glass:rgba(5,32,28,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;font-size:16px;font-weight:600;color:var(--txt);background:#04211d;overflow-x:hidden;padding-bottom:24px}
h1,h2,h3,.lz{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;pointer-events:none;animation:float 14s ease-in-out infinite}
.b1{width:320px;height:320px;background:#0fa88a;top:-80px;right:-80px}
.b2{width:280px;height:280px;background:#c9971f;bottom:8%;left:-90px;animation-delay:-5s}
.b3{width:220px;height:220px;background:#12806a;top:45%;right:20%;animation-delay:-9s}
@keyframes float{50%{transform:translate(30px,-40px) scale(1.15)}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px 14px}
.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(245,196,81,.35);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 22px rgba(61,255,196,.07);text-shadow:0 1px 6px rgba(0,0,0,.7)}
.gold{color:var(--gold);text-shadow:0 0 14px rgba(245,196,81,.45),0 2px 4px #000}
.neon{color:var(--neon);text-shadow:0 0 10px rgba(61,255,196,.6)}
.muted{opacity:.95;font-size:1rem;font-weight:700;line-height:1.9}
.big{font-size:2.1rem;line-height:1.3}
.btn{border:0;border-radius:14px;padding:11px 16px;font:800 1rem Vazirmatn;cursor:pointer;color:#1b1300;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 4px 16px rgba(245,196,81,.4);display:inline-flex;gap:6px;align-items:center;justify-content:center;text-shadow:none}
.btn:active{transform:scale(.96)}
.ghost{background:rgba(61,255,196,.12);color:var(--neon);border:1px solid rgba(61,255,196,.4);box-shadow:none;padding:8px 12px;font-size:.95rem}
select{width:100%;background:rgba(2,20,18,.85);color:var(--txt);border:1px solid rgba(245,196,81,.4);border-radius:12px;padding:10px 8px;font:800 1rem Vazirmatn;appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center}
select option{text-align:center;font-weight:800}
input.nm{width:100%;background:rgba(2,20,18,.85);color:var(--txt);border:1px solid rgba(245,196,81,.4);border-radius:12px;padding:10px;font:800 1rem Vazirmatn;text-align:center}
input.nm:focus{outline:2px solid var(--neon)}
select:focus{outline:2px solid var(--neon)}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid rgba(245,196,81,.3)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),var(--gold));box-shadow:0 0 14px var(--neon);transition:width 1s}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{position:sticky;top:0;z-index:5;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 0;max-width:520px;margin:0 auto}
.tabs>div{display:flex;gap:6px;width:100%;background:rgba(5,32,28,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(245,196,81,.35);border-radius:22px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 22px rgba(61,255,196,.07)}
.tab{flex:1;border:0;background:none;color:#f4fff9;font:800 .98rem Vazirmatn;padding:8px 4px;text-shadow:0 1px 4px #000;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab.on{background:rgba(245,196,81,.16);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(245,196,81,.5)}
.pane{display:none}.pane.on{display:block}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid rgba(61,255,196,.5);color:var(--neon);font-size:.92rem;font-weight:800;margin:3px;padding:3px 12px}
.grid3{display:grid;grid-template-columns:1fr 1.5fr 1.2fr;gap:8px}
.res{border-top:1px dashed rgba(245,196,81,.3);padding:10px 0}
.res:first-child{border:0}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<nav class="tabs"><div>
  <button class="tab on" data-t="0"><i data-lucide="sun"></i>امروز</button>
  <button class="tab" data-t="1"><i data-lucide="repeat"></i>تبدیل</button>
  <button class="tab" data-t="2"><i data-lucide="moon-star"></i>سن و طالع</button>
</div></nav>
<main>
<div class="row" style="margin-bottom:12px">
  <div><h1 class="gold" style="font-size:1.7rem;margin:0" id="hello">سلام</h1><div class="muted" id="wd"></div></div>
  <div class="neon lz" style="font-size:1.6rem;direction:ltr" id="clock">00:00:00</div>
</div>

<section id="p0" class="pane on">
  <div class="card" style="text-align:center">
    <div class="muted">تاریخ شمسی امروز</div>
    <div class="big gold lz" id="jmain"></div>
    <div class="muted" style="margin:10px 0 6px">پیشرفت سال خورشیدی <b class="neon" id="ypct"></b></div>
    <div class="bar"><i id="ybar" style="width:0"></i></div>
    <div class="muted" style="margin-top:6px" id="ydesc"></div>
    <button class="btn ghost" style="margin-top:10px" data-copy="jmain"><i data-lucide="copy"></i> کپی تاریخ شمسی</button>
  </div>
  <div class="card row"><div><div class="muted">میلادی</div><b id="gmain"></b></div><button class="btn ghost" data-copy="gmain"><i data-lucide="copy"></i> کپی</button></div>
  <div class="card row"><div><div class="muted">هجری قمری</div><b id="hmain"></b></div><button class="btn ghost" data-copy="hmain"><i data-lucide="copy"></i> کپی</button></div>
  <div class="card" style="text-align:center"><div class="muted"><span id="nname"></span>تا تحویل سال نو (نوروز <span id="nyear"></span>)</div><div class="big neon lz" id="nowruz"></div><div class="muted" id="ndate"></div></div>
</section>

<section id="p1" class="pane">
  <div class="card">
    <h2 class="gold" style="margin:0 0 10px">تبدیل تاریخ</h2>
    <div class="muted" style="margin-bottom:6px">تقویم مبدأ</div>
    <select id="cal"><option value="j">شمسی (هجری خورشیدی)</option><option value="g">میلادی</option><option value="h">هجری قمری</option></select>
    <div class="grid3" style="margin-top:10px"><select id="cd" aria-label="روز"></select><select id="cm" aria-label="ماه"></select><select id="cy" aria-label="سال"></select></div>
  </div>
  <div class="card" id="cout"></div>
</section>

<section id="p2" class="pane">
  <div class="card">
    <h2 class="gold" style="margin:0 0 10px">تاریخ تولد (شمسی)</h2>
    <div class="grid3"><select id="bd" aria-label="روز"></select><select id="bm" aria-label="ماه"></select><select id="by" aria-label="سال"></select></div>
    <button class="btn" style="width:100%;margin-top:12px" id="calc"><i data-lucide="sparkles"></i> محاسبه</button>
  </div>
  <div id="aout"></div>
</section>
</main>


<script>
const tg=window.Telegram&&Telegram.WebApp;
try{if(tg){tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor('#04211d');tg.setBackgroundColor&&tg.setBackgroundColor('#04211d')}}catch(e){}
const $=id=>document.getElementById(id);
const hap=(t='light')=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t)}catch(e){}};
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const pad=n=>String(n).padStart(2,'0');
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const GM=['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];
const HM=['محرم','صفر','ربیع‌الاول','ربیع‌الثانی','جمادی‌الاول','جمادی‌الثانی','رجب','شعبان','رمضان','شوال','ذی‌القعده','ذی‌الحجه'];
const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const MN={j:JM,g:GM,h:HM};

/* ---------- calendar engine ---------- */
function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];const g2=gm>2?gy+1:gy;
let days=355666+365*gy+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)+gd+gdm[gm-1];
let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;
if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);
const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);
let gy=400*Math.floor(days/146097);days%=146097;
if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}
gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}
let gd=days+1;const sal=[0,31,isLeapG(gy)?29:28,31,30,31,30,31,31,30,31,30,31];let gm;
for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd]}
const isLeapG=y=>(y%4==0&&y%100!=0)||y%400==0;
const isLeapJ=y=>{const g=j2g(y,12,30),r=g2j(g[0],g[1],g[2]);return r[1]==12&&r[2]==30};
const isLeapH=y=>(11*y+14)%30<11;
const jdnG=(y,m,d)=>Math.floor(Date.UTC(y,m-1,d)/864e5)+2440588;
const gFromJdn=j=>{const t=new Date((j-2440588)*864e5);return[t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()]};
const jdnJ=(y,m,d)=>jdnG(...j2g(y,m,d));
const jFromJdn=j=>g2j(...gFromJdn(j));
const jdnH=(y,m,d)=>d+Math.ceil(29.5*(m-1))+(y-1)*354+Math.floor((3+11*y)/30)+1948439;
function hFromJdn(j){const y=Math.floor((30*(j-1948439)+10646)/10631);
const m=Math.min(12,Math.ceil((j-(29+jdnH(y,1,1)))/29.5)+1);return[y,m,j-jdnH(y,m,1)+1]}
const mLen={j:(y,m)=>m<7?31:m<12?30:(isLeapJ(y)?30:29),g:(y,m)=>[31,isLeapG(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1],h:(y,m)=>m%2==1?30:(m==12&&isLeapH(y)?30:29)};
const toJdn={j:jdnJ,g:jdnG,h:jdnH};
const fromJdn={j:jFromJdn,g:gFromJdn,h:hFromJdn};
const leapOf={j:isLeapJ,g:isLeapG,h:isLeapH};
const wdOf=j=>WD[(j+1)%7];
const fmt=(c,[y,m,d])=>`${fa(d)} ${MN[c][m-1]} ${fa(y)}`;
const nowJdn=()=>{const n=new Date();return jdnG(n.getFullYear(),n.getMonth()+1,n.getDate())};

/* ---------- copy + confetti ---------- */
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
hap('medium');try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success')}catch(e){}
confetti({particleCount:90,spread:70,origin:{y:.7},colors:['#f5c451','#3dffc4','#0fa88a','#ffe08a']})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b)copyText($(b.dataset.copy).textContent.trim())});

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{hap();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
document.querySelectorAll('.pane').forEach((p,i)=>p.classList.toggle('on',i==b.dataset.t));window.scrollTo({top:0,behavior:'smooth'})});

/* ---------- today ---------- */
function tickClock(){const n=new Date();$('clock').textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`}
function today(){const j=nowJdn(),[jy,jm,jd]=jFromJdn(j);
$('wd').textContent=wdOf(j);
$('jmain').textContent=`${wdOf(j)} ${fmt('j',[jy,jm,jd])}`;
$('gmain').textContent=fmt('g',gFromJdn(j));$('hmain').textContent=fmt('h',hFromJdn(j));
const start=jdnJ(jy,1,1),len=isLeapJ(jy)?366:365,done=j-start+1,pct=done/len*100;
$('ypct').textContent=fa(pct.toFixed(1))+'٪';$('ybar').style.width=pct+'%';
$('ydesc').textContent=`روز ${fa(done)} از ${fa(len)} روز سال ${fa(jy)}`;
const nj=jdnJ(jy+1,1,1);$('nname').textContent=userName?userName+' عزیز، ':'';$('nyear').textContent=fa(jy+1);$('nowruz').textContent=`${fa(nj-j)} روز`;
$('ndate').textContent=`اول فروردین: ${fmt('g',gFromJdn(nj))}`}
const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
const userName=((u&&u.first_name)||'').replace(/[<>&]/g,'');
function applyName(){$('hello').textContent=userName?`سلام ${userName} عزیز`:'سلام دوست عزیز';today();convert()}

/* ---------- selects ---------- */
function fillSel(sel,from,to,lbl,val){sel.innerHTML='';for(let i=from;i<=to;i++){const o=document.createElement('option');o.value=i;o.textContent=lbl?lbl(i):fa(i);sel.appendChild(o)}sel.value=val}
const RANGE={j:[1250,1500],g:[1870,2120],h:[1290,1500]};
let cur=nowJdn();
function setConv(c,j){const [y,m,d]=fromJdn[c](j);fillSel($('cd'),1,31,null,d);fillSel($('cm'),1,12,i=>MN[c][i-1],m);fillSel($('cy'),RANGE[c][0],RANGE[c][1],null,Math.min(Math.max(y,RANGE[c][0]),RANGE[c][1]))}
function convert(){const c=$('cal').value;let y=+$('cy').value,m=+$('cm').value,d=+$('cd').value;const L=mLen[c](y,m);if(d>L){d=L;$('cd').value=L}
cur=toJdn[c](y,m,d);const row=(k,t)=>{const dt=fromJdn[k](cur);return `<div class="res row"><div><div class="muted">${t}</div><b id="r_${k}" class="${k==c?'gold':''}">${fmt(k,dt)}</b><div class="muted">سال ${fa(dt[0])}: ${leapOf[k](dt[0])?'کبیسه':'عادی'}</div></div><button class="btn ghost" data-copy="r_${k}"><i data-lucide="copy"></i></button></div>`};
$('cout').innerHTML=(userName?`<div class="muted" style="margin-bottom:8px">${userName} عزیز، نتیجهٔ تبدیل شما:</div>`:'')+`<div class="row"><h3 class="neon" style="margin:0;font-size:1.3rem">${wdOf(cur)}</h3><span class="pill">شماره روز ژولیانی ${fa(cur)}</span></div>`+row('j','شمسی')+row('g','میلادی')+row('h','هجری قمری')+`<div class="muted" style="margin-top:8px">تقویم قمری به روش جدولی (حسابی) محاسبه می‌شود و ممکن است تا ۱ روز با رؤیت هلال تفاوت داشته باشد.</div>`;lucide.createIcons()}
['cd','cm','cy'].forEach(i=>$(i).onchange=()=>{hap();convert()});
$('cal').onchange=()=>{hap();setConv($('cal').value,cur);convert()};

/* ---------- moon ---------- */
const SYN=29.530588861,NEW0=2451550.09766; /* Meeus, Astronomical Algorithms ch.49: mean new moon */
function moonAge(jdn){const jd=jdn+0.0;let a=((jd-NEW0)%SYN+SYN)%SYN;return a}
const PH=[
['ماه نو','شب تولد شما در «ماه نو» بوده است؛ زمانی که ماه دیده نمی‌شود و چرخهٔ تازه‌ای از صفر آغاز می‌شود. در نگاه نمادین، متولدان این شب درون‌گرا، شهودی و رؤیاپرداز هستند، دنیای درونی غنی دارند و بیشتر از آن‌که حرف بزنند حس و مشاهده می‌کنند. استقلال، ابتکار و توان شروع دوباره از ویژگی‌های بارز آن‌هاست.','گاهی در بیان احساسات محتاط می‌شوید. نوشتن نیت‌ها و هدف‌ها و گفتن آن‌ها به یک دوست مطمئن، ایده‌هایتان را زودتر به عمل می‌رساند.'],
['هلال نوخیز','ماه در شب تولد شما یک هلال باریک و رو به رشد بوده است. این فاز نماد جوانه زدن، امید و حرکت اولیه است. متولدان آن کنجکاو، پرانرژی و شجاع‌اند، دوست دارند مسیرهای تازه را امتحان کنند و از چالش‌های آغازین نمی‌ترسند.','انرژی شما زیاد است ولی گاهی پراکنده می‌شود؛ تمرکز روی یک هدف در هر دوره، رشد شما را پایدارتر می‌کند.'],
['تربیع اول','در شب تولد شما ماه «تربیع اول» بود و نیمی از قرصش روشن دیده می‌شد. این فاز نماد تصمیم، عمل و عبور از موانع است. متولدان آن عمل‌گرا، مصمم و مقاوم‌اند و در موقعیت‌های دشوار بهتر از دیگران تصمیم می‌گیرند.','ممکن است زیاد خودتان را تحت فشار بگذارید؛ استراحت و بازبینی منظم، تصمیم‌هایتان را دقیق‌تر می‌کند.'],
['ماه رو به بدر (محدب افزاینده)','ماه در شب تولد شما بیش از نیمه روشن بود و به کمال نزدیک می‌شد. این فاز نماد پالایش، پشتکار و تلاش برای بهتر شدن است. متولدان آن کمال‌طلب، دقیق و باانضباط‌اند و همیشه در حال یادگیری و ارتقای خود هستند.','کمال‌گرایی می‌تواند شما را خسته کند؛ به خودتان اجازه دهید پیش از آماده شدن «همه‌چیز» هم قدم بردارید.'],
['ماه کامل (بدر)','شب تولد شما شبی بود که ماه کامل بود و آسمان را کاملاً روشن می‌کرد. این فاز نماد اوج، آشکار شدن حقیقت و احساسات قوی است. متولدان آن معمولاً گرم، پرجاذبه، خلاق و اجتماعی‌اند، عمیقاً احساس می‌کنند و اغلب در مرکز توجه قرار می‌گیرند.','احساسات شدید شما نقطهٔ قوت است، اما در تصمیم‌های مهم بگذارید یک شب بگذرد تا هیجان فروکش کند.'],
['ماه محدب کاهنده','ماه در شب تولد شما از اوج گذشته و کم‌کم از نور آن کاسته می‌شد. این فاز نماد سپاس، تقسیم دانسته‌ها و آموختن است. متولدان آن بخشنده، حکیم و مهربان‌اند و دوست دارند تجربه‌هایشان را به دیگران منتقل کنند.','ممکن است بیشتر به دیگران برسید تا خودتان؛ مرز سالمی برای وقت و انرژی‌تان تعیین کنید.'],
['تربیع آخر','ماه در شب تولد شما در «تربیع آخر» بود؛ دوباره نیمی از آن روشن و نیم دیگر تاریک. این فاز نماد رهاکردن گذشته و بازنگری است. متولدان آن منطقی، انعطاف‌پذیر و اهل بازآفرینی خود هستند و از تجربه‌های قبلی درس می‌گیرند.','رها کردن عادت‌ها و روابط فرسوده برای شما آسان‌تر از چیزی است که فکر می‌کنید؛ از این توانایی آگاهانه استفاده کنید.'],
['هلال پایانی','شب تولد شما ماه به یک هلال باریک پیش از «ماه نو» رسیده بود. این فاز نماد آرامش، پایان‌ها و بازگشت به خویشتن است. متولدان آن تأمل‌گر، همدل و شهودی‌اند و کشش طبیعی به معنویت، هنر و مراقبه دارند.','برای شارژ شدن به خلوت نیاز دارید؛ زمان‌های سکوت را در برنامه‌تان بگذارید و از آن شرمنده نباشید.']];
function moonSVG(age){const f=age/SYN,r=48,c=50,cs=Math.cos(2*Math.PI*f),rx=(r*Math.abs(cs)).toFixed(2),wax=f<.5;
const s2=wax?(cs>0?0:1):(cs>0?1:0),s1=wax?1:0;
const lit=`M${c},${c-r} A${r},${r} 0 0 ${s1} ${c},${c+r} A${rx},${r} 0 0 ${s2} ${c},${c-r}Z`;
return `<svg viewBox="0 0 100 100" width="130" height="130"><circle cx="50" cy="50" r="48" fill="#06231f" stroke="#f5c451" stroke-opacity=".5" stroke-width="1.5"/><circle cx="50" cy="50" r="49.5" fill="none" stroke="#ffe08a" stroke-opacity=".25" stroke-width="3"/><path d="${lit}" fill="#ffe9a8"/></svg>`}

/* ---------- zodiac ---------- */
const ANI=[

['سرطان','♋','آب','ماه','«من احساس می‌کنم.»','متولدان تیر دلسوز، خانواده‌دوست و دارای شهودی قوی‌اند. حافظهٔ عاطفی عمیق دارند و از عزیزان‌شان محافظت می‌کنند. گاهی زودرنج‌اند و در لاک خود فرو می‌روند.','احساساتتان را بیان کنید به‌جای آن‌که نگه دارید؛ نزدیکان‌تان آمادهٔ شنیدن‌اند.'],
['اسد','♌','آتش','خورشید','«من می‌درخشم.»','متولدان مرداد بخشنده، گرم و دارای حضوری پررنگ‌اند و طبیعتاً رهبرند. به صداقت و احترام اهمیت می‌دهند و دوست دارند دیده شوند. ممکن است در برابر نقد حساس باشند.','قدردانی از دیگران، درخشش شما را دوچندان می‌کند؛ رهبری یعنی نور دادن به همه.'],

const FL=['نرگس','گل‌سرخ','یاس','نیلوفر آبی','آفتابگردان','ریحان','داودی','زعفران','شمعدانی','گل مریم','شقایق','بنفشه'];
const ST=['الماس','زمرد','مروارید','یاقوت سرخ','عقیق','یاقوت کبود','اپال','توپاز','فیروزه','گارنت','آمتیست','آکوامارین'];
/* ---------- age ---------- */
function ageCalc(){const jy=+$('by').value,jm=+$('bm').value;let jd=+$('bd').value;jd=Math.min(jd,mLen.j(jy,jm));
const bj=jdnJ(jy,jm,jd),tj=nowJdn();
if(bj>tj){$('aout').innerHTML='<div class="card">تاریخ تولد نمی‌تواند در آینده باشد. تاریخ را اصلاح کنید.</div>';return}
const [ty,tm,td]=jFromJdn(tj);let Y=ty-jy,M=tm-jm,D=td-jd;
if(D<0){M--;let pm=tm-1,py=ty;if(pm<1){pm=12;py--}D+=mLen.j(py,pm)}
if(M<0){Y--;M+=12}
const total=tj-bj,tMonths=Y*12+M,tWeeks=Math.floor(total/7),nf=n=>fa(n.toLocaleString('en')),nm=userName?userName+' عزیز، ':'';
/* next birthday */
let ny=ty,nj;const bd=Math.min(jd,mLen.j(ny,jm));nj=jdnJ(ny,jm,bd);if(nj<tj){ny++;nj=jdnJ(ny,jm,Math.min(jd,mLen.j(ny,jm)))}
const left=nj-tj,candles=ny-jy;
const [gy,gm,gd]=gFromJdn(bj),age=moonAge(bj+0.5),ill=(1-Math.cos(2*Math.PI*age/SYN))/2*100,pi=Math.floor(((age/SYN)*8+.5))%8,P=PH[pi];
const an=ANI[(((gy-4)%12)+12)%12],z=ZOD[jm-1];
const hb=Math.round(total*1440*72/1e6),moons=Math.floor(total/SYN),sleepY=(total/3/365.25).toFixed(1),secs=Math.round(total*86400/1e6);
$('aout').innerHTML=`
<div class="card"><h3 class="gold" style="font-size:1.3rem;margin:0 0 8px">سن شما</h3>
<p style="line-height:2.2;margin:0;font-weight:700">${nm}شما <b class="neon">${fa(Y)}</b> سالتان است که می‌شود گفت از روز تولدتان تا الان <b class="neon">${nf(tMonths)}</b> ماه، <b class="neon">${nf(tWeeks)}</b> هفته و <b class="neon">${nf(total)}</b> روز را زندگی کرده‌اید. ان‌شاءالله عمرتان دراز و پربرکت باشد.</p>
<div class="muted" style="margin-top:8px">تاریخ تولد شما (${wdOf(bj)} ${fmt('j',[jy,jm,jd])} ≈ ${fmt('g',[gy,gm,gd])})</div></div>
<div class="card" style="text-align:center"><div style="font-size:2.4rem">🎂</div><div>در تولد بعدی باید شمع <b class="gold lz" style="font-size:1.6rem">${fa(candles)}</b> سالگی را فوت کنید!</div><div class="muted">${fa(left)} روز دیگر (${fmt('j',jFromJdn(nj))})</div></div>
<div class="card"><h3 class="gold" style="font-size:1.3rem;margin:0 0 6px">نکته‌های جالب دربارهٔ شما</h3>
<div class="res"><div class="muted">روز هفتهٔ تولد</div><b>${wdOf(bj)}</b> <span class="muted">(تولد بعدی: ${wdOf(nj)})</span></div>
<div class="res"><div class="muted">ضربان قلب تا امروز (حدود ۷۲ بار در دقیقه)</div><b class="neon">${nf(hb)} میلیون بار</b></div>
<div class="res"><div class="muted">ثانیه‌های زندگی</div><b class="neon">${nf(secs)} میلیون ثانیه</b></div>
<div class="res"><div class="muted">تعداد ماه کامل‌هایی که دیده‌اید</div><b class="neon">حدود ${nf(moons)} بار</b></div>
<div class="res"><div class="muted">زمان خواب (حدود یک‌سوم عمر)</div><b class="neon">حدود ${fa(sleepY)} سال</b></div>
<div class="res"><div class="muted">گل و سنگ نمادین ماه تولد</div><span class="pill">گل ${FL[jm-1]}</span><span class="pill">سنگ ${ST[jm-1]}</span></div></div>
<div class="card" style="text-align:center"><h3 class="gold" style="font-size:1.3rem;margin:0">ماه در شب تولد</h3>
<div style="margin:8px 0">${moonSVG(age)}</div><div class="neon lz" style="font-size:1.3rem">${P[0]}</div>
<div class="muted">درخشش قرص: ${fa(ill.toFixed(0))}٪ · سن ماه: ${fa(age.toFixed(1))} روز</div>
<p style="line-height:2;text-align:justify">${P[1]}</p><p style="line-height:2;text-align:justify"><b class="gold">توصیه:</b> ${P[2]}</p>
<div class="muted">منبع: میانگین دورهٔ هلالی (سینودی) بر پایهٔ الگوریتم‌های ژان میوس، «Astronomical Algorithms» (فصل ۴۹). دقت تقریبی ±۱۴ ساعت؛ تحلیل روان‌شناختی جنبهٔ نمادین دارد.</div></div>
<div class="card"><h3 class="gold" style="font-size:1.3rem;margin:0 0 6px">حیوان سال تولد</h3>
<div class="row" style="justify-content:flex-start"><span style="font-size:3rem">${an[1]}</span><div><b class="neon lz" style="font-size:1.4rem">سال ${an[0]}</b><div class="muted">زودیاک چینی (سال میلادی ${fa(gy)})</div></div></div>
<p style="line-height:2;text-align:justify">${an[2]}</p><p style="line-height:2;text-align:justify"><b class="gold">در کار و روابط:</b> ${an[3]}</p><div class="muted">توجه: سال چینی از ماه‌نوی بین ۲۱ ژانویه تا ۲۰ فوریه آغاز می‌شود؛ متولدان اوایل سال ممکن است به حیوان سال قبل تعلق داشته باشند.</div></div>
<div class="card"><h3 class="gold" style="font-size:1.3rem;margin:0 0 6px">برج فلکی: ${z[1]} ${z[0]}</h3>
<span class="pill">عنصر: ${z[2]}</span><span class="pill">سیارهٔ حاکم: ${z[3]}</span><span class="pill">شعار: ${z[4]}</span>
<p style="line-height:2;text-align:justify">${z[5]}</p><p style="line-height:2;text-align:justify"><b class="gold">نکتهٔ زندگی:</b> ${z[6]}</p></div>
<div class="card muted" style="line-height:1.9"><b class="gold">منابع:</b> زودیاک خورشیدی بر پایهٔ سنت بابلی-یونانی (بطلمیوس، «تتراببلوس») و تقویم هجری خورشیدی بر پایهٔ اصلاح جلالی (۴۶۷ ه‍.ق) و الگوریتم ۳۳ ساله؛ دورهٔ ۱۲ حیوانی برگرفته از تقویم قمری-خورشیدی شرق آسیا. این محتوا جنبهٔ سرگرمی و فرهنگی دارد.</div>`;
lucide.createIcons();hap('medium');
confetti({particleCount:110,spread:80,origin:{y:.6},colors:['#f5c451','#3dffc4','#ffe08a']})}
$('calc').onclick=ageCalc;

/* ---------- init ---------- */
function init(){const [jy]=jFromJdn(nowJdn());
fillSel($('bd'),1,31,null,1);fillSel($('bm'),1,12,i=>JM[i-1],1);fillSel($('by'),1300,jy,null,jy-25);
setConv('j',cur);convert();applyName();tickClock();setInterval(tickClock,1000);setInterval(today,60000);lucide.createIcons()}
init();
</script>
